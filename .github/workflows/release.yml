# Publication. Runs only on a version tag, because a release that can be produced by any
# push is not a release. `main` must already be green from ci.yml before a tag is worth
# pushing.
#
# Authorisation is PyPI's trusted publishing: this job asks GitHub for an OIDC token and
# PyPI accepts it because the project on PyPI names this repo, this workflow file and the
# `pypi` environment. No API token is stored in the repository or on any laptop, and the
# pairing can be revoked from the PyPI side.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test, build and check the artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The wheel's version comes from [project].version, so a tag that skips the bump
      # would publish the previous release's bytes under a new name.
      - name: The tag must match the declared version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "${tag}" != "${declared}" ]; then
            echo "::error::tag is v${tag} but pyproject.toml declares ${declared}"
            exit 1
          fi

      - name: Run the suite before publishing it
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all,dev]"
          python -m ruff check src tests plugin-examples
          python -m ruff format --check src tests plugin-examples
          python -m mypy
          python -m pytest -m "not integration"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist

      # So a person can verify the file they downloaded is the file this run produced,
      # without trusting the transport.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.whl > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release and attach the artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No checkout in this job, so gh has to be told which repository to talk to.
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            dist/*

  publish-pypi:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment must exist on PyPI as a trusted publisher before this can pass;
    # see docs/technology/PYTHON_PACKAGING.md §Publishing.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-response: false
